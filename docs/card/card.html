<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epox business card</title>
<!--
  Epox business card, Holo Foil theme. Portrait 51 × 89 mm (2 × 3.5 in) + 3 mm bleed each side.
  Render: node scripts/render-card.js  → docs/card/card-front.png, card-back.png (300 dpi, with bleed),
  card-preview.png (both sides, trimmed) and card.pdf (2 pages, 57 × 95 mm).
  The QR code on the back is real: it opens https://epox.systems (updated 2026-11-22).
  Characters: v4 "Hello" draft (AI reference art), to be replaced by the final redrawn art.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Unbounded:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --black: #0B0B0D;
    --pearl: #F4F4F5;
    --steel: #DCDCE1;
    --lime: #C6FF3D;
    --infrared: #FF3B30;
    --bleed: 3mm;
    --display: 'Unbounded', sans-serif;
    --text: 'Manrope', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #D9D9DE; font-family: var(--text); padding: 10mm; }
  /* Chrome rounds PDF page sizes to whole points, so the page is set in pt (162 × 270 pt ≈ 57.15 × 95.25 mm)
     and the card fills it exactly; the trim box stays centred (bleed ≈ 3.1 mm). */
  @page { size: 162pt 270pt; margin: 0; }
  @media print {
    body { background: none; padding: 0; }
    .preview, .print-row > h2 { display: none !important; }
    .print-row { display: block !important; }
    html body .card { break-after: page; width: 162pt; height: 270pt; }
    html body .trim-frame { left: calc((162pt - 51mm) / 2); top: calc((270pt - 89mm) / 2); } /* overfill by 0.4 mm so no hairline of paper shows at the page edge */
  }

  .print-row { display: flex; gap: 10mm; margin-bottom: 10mm; }
  .card {
    position: relative; overflow: hidden;
    width: calc(51mm + 2 * var(--bleed)); height: calc(89mm + 2 * var(--bleed));
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  /* children are positioned in TRIM coordinates via this inner frame */
  .trim-frame { position: absolute; left: var(--bleed); top: var(--bleed); width: 51mm; height: 89mm; }

  /* ---------- FRONT ---------- */
  .front { background: var(--black); color: var(--pearl); }
  .front svg.mark { position: absolute; left: 0; top: 0; width: 54mm; height: 89mm; overflow: visible; }
  .front .house {
    position: absolute; left: 5.2mm; top: 54mm;
    font: 600 1.72mm/1 var(--text); letter-spacing: 0.4em; color: #C9C9CF;
  }
  .front .tagline {
    position: absolute; left: 5mm; top: 71mm; width: 41mm;
    font: 600 2.45mm/1.16 var(--display); letter-spacing: -0.01em; color: var(--pearl);
  }
  .front .pills { position: absolute; left: 5mm; top: 78.4mm; display: flex; gap: 1.3mm; }
  .pill-o {
    display: inline-flex; align-items: center; gap: 0.9mm;
    height: 4.3mm; padding: 0 2.1mm; border-radius: 99mm;
    border: 0.22mm solid rgba(244, 244, 245, 0.75);
    font: 600 1.85mm/1 var(--text); color: var(--pearl);
  }
  .pill-o .dot { width: 1mm; height: 1mm; border-radius: 50%; background: var(--lime); }

  /* ---------- BACK ---------- */
  .back { background: var(--pearl); color: var(--black); }
  .back .headline {
    position: absolute; left: 5mm; top: 6.5mm;
    font: 700 6mm/1.08 var(--display); letter-spacing: -0.02em; white-space: nowrap;
  }
  .back .found { position: relative; display: inline-block; }
  .back .found svg { position: absolute; left: -12%; top: -15%; width: 124%; height: 132%; overflow: visible; }
  .back .found path { fill: none; stroke: var(--infrared); stroke-linecap: round; stroke-linejoin: round; }
  .back .talk {
    position: absolute; left: 5mm; top: 25mm;
    display: inline-flex; align-items: center; height: 6mm; padding: 0 3.2mm; border-radius: 99mm;
    background: var(--lime); font: 700 2.3mm/1 var(--text); color: var(--black);
  }
  .back .qr { position: absolute; left: 5mm; top: 34.5mm; width: 15mm; height: 15mm; }
  .back .qr-note { position: absolute; left: 5mm; top: 51mm; font: 600 1.6mm/1.25 var(--text); color: #55555C; }
  .back .duo { position: absolute; right: 2.2mm; bottom: calc(-1 * var(--bleed)); width: 37mm; }

  /* ---------- PREVIEW (trimmed, both sides) ---------- */
  .preview { display: inline-flex; gap: 8mm; padding: 8mm; background: #D9D9DE; }
  .preview .trimmed { width: 51mm; height: 89mm; overflow: hidden; position: relative; box-shadow: 0 0.6mm 2.4mm rgba(0,0,0,.18); }
  .preview .trimmed > .card { position: absolute; left: calc(-1 * var(--bleed)); top: calc(-1 * var(--bleed)); }
  h2 { display: none; }
</style>
</head>
<body>

<div class="print-row">
  <!-- FRONT -->
  <section class="card front" id="front">
    <div class="trim-frame">
      <svg class="mark" viewBox="0 0 54 89" xmlns="http://www.w3.org/2000/svg" aria-label="epox">
        <defs>
          <linearGradient id="holoE" x1="0" y1="0" x2="1" y2="0.35">
            <stop offset="0" stop-color="#EEF1FF"/>
            <stop offset="0.22" stop-color="#D7F7E7"/>
            <stop offset="0.48" stop-color="#FFF0B8"/>
            <stop offset="0.7" stop-color="#BDE9FF"/>
            <stop offset="0.86" stop-color="#ACD8FF"/>
            <stop offset="1" stop-color="#D3CBFF"/>
          </linearGradient>
          <linearGradient id="holoWord" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#C2C6FF"/>
            <stop offset="0.3" stop-color="#D8F6EA"/>
            <stop offset="0.56" stop-color="#FFEFB2"/>
            <stop offset="0.78" stop-color="#B4E7FF"/>
            <stop offset="1" stop-color="#C8C1FF"/>
          </linearGradient>
        </defs>
        <!-- big slanted E, cut by the right edge (extends into the bleed) -->
        <path fill="url(#holoE)" fill-rule="evenodd" d="
          M24.8 17.8 L54 17.8 L54 35.4 L20.2 35.4 Z
          M27.24 21.1 L54 21.1 L54 24.96 L26.23 24.96 Z
          M25.35 28.34 L54 28.34 L54 32.2 L24.34 32.2 Z"/>
        <!-- wordmark: font size is fitted to 36 mm width by the script below -->
        <text id="word" x="4.6" y="46.6" fill="url(#holoWord)"
              font-family="Unbounded" font-weight="600" font-size="14" letter-spacing="-0.3">epox</text>
      </svg>
      <div class="house">software house</div>
      <p class="tagline">Sleek, rare and made to be noticed.</p>
      <div class="pills">
        <span class="pill-o"><span class="dot"></span>sleek</span>
        <span class="pill-o">premium</span>
        <span class="pill-o">modern</span>
      </div>
    </div>
  </section>

  <!-- BACK -->
  <section class="card back" id="back">
    <div class="trim-frame">
      <h1 class="headline">We find it<br><span class="found">first.<svg viewBox="0 0 200 100" preserveAspectRatio="none" aria-hidden="true"><path id="circle"/></svg></span></h1>
      <span class="talk">Let's talk</span>
      <svg class="qr" id="qr" viewBox="0 0 25 25" shape-rendering="crispEdges" aria-label="QR code: epox.systems"></svg>
      <p class="qr-note">Scan to see our work</p>
      <img class="duo" src="characters-hello.png" alt="">
    </div>
  </section>
</div>

<div class="preview" id="preview">
  <div class="trimmed" id="slot-front"></div>
  <div class="trimmed" id="slot-back"></div>
</div>

<script>
  // hand-drawn "found" circle: one loop with a small overshoot, like a pen mark
  (function circle() {
    const pts = [];
    for (let k = 0; k < 160; k++) {
      const t = -2.3 + (k / 159) * (2 * Math.PI + 0.55);
      const r = 1 + 0.03 * Math.sin(t * 3 + 1) + 0.03 * (k / 159);
      pts.push([100 + 94 * r * Math.cos(t), 50 + 44 * r * Math.sin(t)]);
    }
    const p = document.getElementById('circle');
    p.setAttribute('d', 'M' + pts.map(q => q[0].toFixed(2) + ' ' + q[1].toFixed(2)).join(' L'));
    p.setAttribute('vector-effect', 'non-scaling-stroke');
    p.style.strokeWidth = '0.5mm';
  })();

  // real QR code: https://epox.systems (error correction Q, 25 × 25 modules; generated with the qrcode package)
  (function qr() {
    const rows = ["1111111001001010101111111", "1000001011100001101000001", "1011101001001011101011101", "1011101010001011001011101", "1011101000111101101011101", "1000001011011100101000001", "1111111010101010101111111", "0000000011010110000000000", "1011011110101010011101010", "0111110001110011101110100", "1001011101010111001001110", "1111000110110101101010110", "1101001111111100101001101", "0000010011010010010011010", "1111101111101011110111001", "1101110000011000001001110", "0101111101100000111111111", "0000000010001100100010100", "1111111011101101101010011", "1000001010000110100011101", "1011101000110011111111100", "1011101010001100111111010", "1011101010000110100101100", "1000001000101001001100001", "1111111011101110011010101"];
    const svg = document.getElementById('qr'), on = [];
    rows.forEach((r, y) => [...r].forEach((c, x) => { if (c === '1') on.push([x, y]); }));
    svg.innerHTML = on.map(([x, y]) => `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="#0B0B0D"/>`).join('');
  })();

  // fit the wordmark to 36 mm, then build the trimmed preview from clones
  document.fonts.ready.then(() => {
    const w = document.getElementById('word');
    const len = w.getComputedTextLength();
    w.setAttribute('font-size', (14 * 36.4 / len).toFixed(3));
    for (const side of ['front', 'back']) {
      const c = document.getElementById(side).cloneNode(true);
      c.removeAttribute('id');
      c.querySelectorAll('[id]').forEach(el => {
        if (el.tagName.toLowerCase() === 'lineargradient') return; // keep gradient ids
        el.removeAttribute('id');
      });
      document.getElementById('slot-' + side).appendChild(c);
    }
    const img = document.querySelector('#back .duo');
    (img.complete ? Promise.resolve() : new Promise(r => img.onload = r)).then(() => { window.__ready = true; });
  });
</script>
</body>
</html>
