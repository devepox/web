<!doctype html>
<html><head><meta charset="utf-8"><title>epox glass E (design lab)</title>
<style>html,body{margin:0;background:#0B0C0F;overflow:hidden}canvas{display:block}</style>
<!-- served from the repo root (scripts/logo-3d/serve.js), so it runs the site's own glass scene and three.js copy -->
<script type="importmap">{"imports":{"three":"/site/node_modules/three/build/three.module.js","three/examples/jsm/":"/site/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
/*
 * Design lab (2026-11-24): the brand E (the foil device's slanted spine + three short bars) as the site's holographic
 * glass, for the landing concept "F · Glass E". Same scene module as the live hero; the E outline is scaled ×6 so the
 * bevels match the wordmark's proportions.
 * Query: w, h (px), fit (E width as a share of the frame), arm (bar length in E units, the device runs them to 1336),
 * bx/by/bs (foil bars backdrop). Exposes window.ready and window.renderAt(t, sway) → PNG data URL.
 */
import { createGlassScene } from '/site/src/components/brand/glass-scene.js';
const P = new URLSearchParams(location.search);
const W = +(P.get('w') ?? 1920), H = +(P.get('h') ?? 1080), K = 6, ARM = +(P.get('arm') ?? 330);
const pts = [[169.2, 39], [ARM, 39], [ARM, 59.8], [189.5, 59.8], [182.2, 85.8], [ARM, 85.8], [ARM, 106.6], [177, 106.6], [169.7, 132.6], [ARM, 132.6], [ARM, 153.4], [138, 153.4]];
const path = 'M' + pts.map(([x, y]) => `${(x * K).toFixed(1)} ${(y * K).toFixed(1)}`).join(' L') + ' Z';
const canvas = document.createElement('canvas'); canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; document.body.append(canvas);
const s = createGlassScene(canvas, {
  path, quality: 'export', fit: +(P.get('fit') ?? 0.36), dpr: 1, preserve: true, intro: false,
  bars: { x: +(P.get('bx') ?? 340), y: +(P.get('by') ?? 60), s: +(P.get('bs') ?? 1.15) },
  look: P.get('look') ? JSON.parse(P.get('look')) : undefined, // e.g. {"room":0.8,"exposure":1.3}
});
s.resize(W, H);
await s.compiling;
window.renderAt = (t, sway = 0.7) => { s.renderAt(t, sway); return canvas.toDataURL('image/png'); };
window.ready = true;
</script>
</body></html>
